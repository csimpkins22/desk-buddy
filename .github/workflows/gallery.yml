# Builds the gallery of Lump's animations and puts it on GitHub Pages (Settings > Pages > Source: GitHub Actions).
name: Gallery
on:
  push:
    branches: [main]
    paths: [design/**, firmware/data/lump.bin, firmware/src/vec.h, gallery/**, tools/**, .github/workflows/gallery.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/build_gallery.py      # bakes every clip with the runner's Chrome
      - uses: actions/upload-pages-artifact@v3
        with:
          path: gallery
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
